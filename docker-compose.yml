services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-falae}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-analysis-api:
    build:
      context: ./mock-analysis-api
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && pnpm start"]
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-falae}
      REDIS_URL: redis://redis:6379
      ANALYSIS_API_URL: http://mock-analysis-api:4000
      ANALYSIS_API_TIMEOUT_MS: ${ANALYSIS_API_TIMEOUT_MS:-2000}
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    command: ["pnpm", "start:worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-falae}
      REDIS_URL: redis://redis:6379
      ANALYSIS_API_URL: http://mock-analysis-api:4000
      ANALYSIS_API_TIMEOUT_MS: ${ANALYSIS_API_TIMEOUT_MS:-2000}
    depends_on:
      api:
        condition: service_healthy
      mock-analysis-api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://api:3333
    ports:
      - "5173:4173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
